{% extends "base.html" %}
{% import "_ui.html" as ui %}
{% block title %}个人设置 - 校园论坛{% endblock %}

{% block content %}
<div class="narrow-wrap">
  <div class="card">
    <h3 class="side-title">{{ ui.icon("settings", 15) }}基础资料</h3>
    <form method="post" class="post-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="action" value="profile">

      <label>头像配色</label>
      <div class="avatar-picker">
        {% for a in AVATARS %}
        <label class="avatar-option" title="{{ a }}">
          <input type="radio" name="avatar" value="{{ a }}" {{ 'checked' if g.user['avatar'] == a }}>
          <span class="av av-md av-{{ a }}">{{ (g.user['nickname'][:1]) | upper }}</span>
        </label>
        {% endfor %}
      </div>

      <label for="set-nickname">昵称</label>
      <input id="set-nickname" type="text" name="nickname" required maxlength="20"
             value="{{ g.user['nickname'] }}">

      <label for="set-bio">个性签名</label>
      <textarea id="set-bio" name="bio" rows="3" maxlength="100"
                placeholder="介绍一下自己吧…">{{ g.user['bio'] }}</textarea>
      <div class="field-foot">
        <span class="char-count" data-count-for="set-bio" data-max="100">0/100</span>
      </div>

      <button type="submit" class="btn btn-primary">保存资料</button>
    </form>
  </div>

  <div class="card">
    <h3 class="side-title">{{ ui.icon("lock", 15) }}修改密码</h3>
    <form method="post" class="post-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="action" value="password">
      <label for="old-password">原密码</label>
      <input id="old-password" type="password" name="old_password" required
             autocomplete="current-password" maxlength="128">
      <label for="new-password">新密码</label>
      <input id="new-password" type="password" name="new_password" required
             autocomplete="new-password" maxlength="128" placeholder="至少 6 位">
      <label for="new-password2">确认新密码</label>
      <input id="new-password2" type="password" name="new_password2" required
             autocomplete="new-password" maxlength="128">
      <button type="submit" class="btn btn-primary">修改密码</button>
    </form>
  </div>
</div>
{% endblock %}
