{% extends "base.html" %}
{% import "_ui.html" as ui %}
{% block title %}注册 - 校园论坛{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="auth-head">
      <span class="auth-mark">{{ ui.icon("user", 22) }}</span>
      <div>
        <h2>加入校园论坛</h2>
        <p class="muted">注册后即可发帖、评论、点赞（首位注册用户将成为管理员）</p>
      </div>
    </div>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="reg-username">用户名</label>
      <input id="reg-username" type="text" name="username" required autofocus
             autocomplete="username" maxlength="20"
             placeholder="2-20 位字母、数字、下划线或中文">
      <label for="reg-nickname">昵称（可选）</label>
      <input id="reg-nickname" type="text" name="nickname" maxlength="20"
             placeholder="展示给大家的名字，默认同用户名">
      <label for="reg-password">密码</label>
      <input id="reg-password" type="password" name="password" required
             autocomplete="new-password" maxlength="128" placeholder="至少 6 位">
      <label for="reg-password2">确认密码</label>
      <input id="reg-password2" type="password" name="password2" required
             autocomplete="new-password" maxlength="128" placeholder="再次输入密码">
      <button type="submit" class="btn btn-primary btn-block">注册</button>
    </form>
    <p class="auth-switch">已有账号？<a href="{{ url_for('login') }}">直接登录</a></p>
  </div>
</div>
{% endblock %}
