{% extends "base.html" %}
{% import "_ui.html" as ui %}
{% block title %}登录 - 校园论坛{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="auth-head">
      <span class="auth-mark">{{ ui.icon("user", 22) }}</span>
      <div>
        <h2>欢迎回来</h2>
        <p class="muted">登录校园论坛，和同学们一起交流</p>
      </div>
    </div>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="login-username">用户名</label>
      <input id="login-username" type="text" name="username" required autofocus
             autocomplete="username" maxlength="20" placeholder="请输入用户名">
      <label for="login-password">密码</label>
      <input id="login-password" type="password" name="password" required
             autocomplete="current-password" maxlength="128" placeholder="请输入密码">
      <button type="submit" class="btn btn-primary btn-block">登录</button>
    </form>
    <p class="auth-switch">还没有账号？<a href="{{ url_for('register') }}">立即注册</a></p>
  </div>
</div>
{% endblock %}
